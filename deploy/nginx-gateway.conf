user nginx;
worker_processes auto;
events { worker_connections 256; }
http {
    log_format local escape=json '{"severity":"INFO","service":"gateway","logger":"nginx.access","message":"HTTP request","method":"$request_method","path":"$uri","status":$status,"duration":$request_time,"request_id":"$request_id"}';
    access_log /dev/stdout local;
    error_log /dev/stderr warn;
    server_tokens off;
    client_max_body_size 64k;

    map $http_origin $origin_allowed {
        default 0;
        "" 1;
        ~^http://(localhost|127\.0\.0\.1):(8000|8001)$ 1;
    }
    map "$uri:$request_method:$http_sec_fetch_site:$http_sec_fetch_mode:$http_sec_fetch_dest" $cross_site_blocked {
        default 0;
        ~^/callback: 0;
        ~:GET:cross-site:navigate:document$ 0;
        ~:HEAD:cross-site:navigate:document$ 0;
        ~:cross-site: 1;
    }

    add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; font-src 'self'; form-action 'self' https://passi.cloud; frame-ancestors 'none'; base-uri 'none'; object-src 'none'" always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Content-Type-Options nosniff always;
    map $upstream_http_cache_control $response_cache_control {
        default "no-store";
        "public, max-age=31536000, immutable" "public, max-age=31536000, immutable";
    }
    proxy_hide_header Cache-Control;
    add_header Cache-Control $response_cache_control always;

    server {
        listen 8000 default_server;
        listen 8001 default_server;
        server_name _;
        return 403;
    }
    server {
        listen 8000;
        server_name localhost 127.0.0.1;
        if ($origin_allowed = 0) { return 403; }
        if ($cross_site_blocked = 1) { return 403; }
        location / {
            proxy_pass http://app:8000;
            proxy_set_header Host $http_host;
            proxy_read_timeout 180s;
        }
    }
    server {
        listen 8001;
        server_name localhost 127.0.0.1;
        if ($origin_allowed = 0) { return 403; }
        if ($cross_site_blocked = 1) { return 403; }
        location = /mcp {
            proxy_pass http://mcp:8001;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header Connection "";
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 3600s;
        }
        location = /.well-known/oauth-protected-resource/mcp {
            proxy_pass http://mcp:8001;
            proxy_set_header Host $http_host;
            proxy_buffering off;
            proxy_cache off;
        }
        location / { return 404; }
    }
}
