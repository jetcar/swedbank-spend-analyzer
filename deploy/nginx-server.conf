user nginx;
worker_processes auto;
events { worker_connections 256; }
http {
    log_format restricted escape=json '{"severity":"INFO","service":"gateway","logger":"nginx.access","message":"HTTP request","method":"$request_method","path":"$uri","status":$status,"duration":$request_time,"request_id":"$request_id"}';
    access_log /dev/stdout restricted;
    error_log /dev/stderr warn;
    server_tokens off;
    client_max_body_size 64k;
    resolver 127.0.0.11 valid=10s ipv6=off;

    map $http_origin $origin_allowed {
        default 0;
        "" 1;
        "https://finance.passi.cloud" 1;
        ~^http://(localhost|127\.0\.0\.1):18000$ 1;
    }
    map "$uri:$request_method:$http_sec_fetch_site:$http_sec_fetch_mode:$http_sec_fetch_dest" $cross_site_blocked {
        default 0;
        ~^/(auth/)?callback: 0;
        ~:GET:cross-site:navigate:document$ 0;
        ~:HEAD:cross-site:navigate:document$ 0;
        ~:cross-site: 1;
    }
    map $http_x_forwarded_proto $forwarded_proto {
        default $scheme;
        https https;
    }
    map $http_x_forwarded_proto $hsts_header {
        default "";
        https "max-age=31536000";
    }

    add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; font-src 'self'; form-action 'self' https://passi.cloud; frame-ancestors 'none'; base-uri 'none'; object-src 'none'" always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Content-Type-Options nosniff always;
    add_header Strict-Transport-Security $hsts_header always;
    map $upstream_http_cache_control $response_cache_control {
        default "no-store";
        "public, max-age=31536000, immutable" "public, max-age=31536000, immutable";
    }
    proxy_hide_header Cache-Control;
    add_header Cache-Control $response_cache_control always;

    server {
        listen 8000 default_server;
        server_name _;
        return 403;
    }
    server {
        listen 8000;
        server_name finance.passi.cloud finance-gateway localhost 127.0.0.1;
        if ($origin_allowed = 0) { return 403; }
        if ($cross_site_blocked = 1) { return 403; }
        # Resolve again after app recreation instead of keeping a stale container IP.
        set $app_backend app:8000;
        set $mcp_backend mcp:8001;
        location = /.well-known/oauth-protected-resource/mcp {
            proxy_pass http://$mcp_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
            proxy_set_header Connection "";
            proxy_buffering off;
            proxy_cache off;
        }
        location = /mcp {
            proxy_pass http://$mcp_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
            proxy_set_header Connection "";
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 3600s;
        }
        location / {
            proxy_pass http://$app_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
            proxy_set_header Connection "";
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 3600s;
        }
    }
}
