user nginx;
worker_processes auto;
events { worker_connections 256; }
http {
    # Do not record authorization codes, request bodies or query parameters.
    log_format restricted escape=json '{"severity":"INFO","service":"bank-egress","logger":"nginx.access","message":"HTTP request","method":"$request_method","path":"$uri","status":$status,"duration":$request_time,"request_id":"$request_id"}';
    access_log /dev/stdout restricted;
    error_log /dev/stderr warn;
    server_tokens off;
    resolver 127.0.0.11 valid=60s ipv6=off;
    resolver_timeout 5s;

    map "$request_method:$uri" $bank_request_allowed {
        default 0;
        "POST:/auth" 1;
        "POST:/sessions" 1;
        "GET:/application" 1;
        ~^GET:/accounts/[a-zA-Z0-9-]+/transactions$ 1;
    }

    map "$request_method:$uri" $passi_request_allowed {
        default 0;
        "GET:/passi/openidc/.well-known/jwks" 1;
        "POST:/passi/openidc/connect/token" 1;
    }

    server {
        listen 8080 default_server;
        server_name _;
        client_max_body_size 32k;
        location ^~ /passi/ {
            if ($passi_request_allowed = 0) { return 403; }
            proxy_pass https://passi.cloud/;
            proxy_set_header Host passi.cloud;
            proxy_ssl_name passi.cloud;
            proxy_set_header Connection "";
            proxy_set_header Cookie "";
            proxy_ssl_server_name on;
            proxy_ssl_verify on;
            proxy_ssl_verify_depth 4;
            proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
            proxy_connect_timeout 10s;
            proxy_read_timeout 30s;
            proxy_redirect off;
        }
        location / {
            if ($bank_request_allowed = 0) { return 403; }
            proxy_pass https://api.enablebanking.com;
            proxy_set_header Host api.enablebanking.com;
            proxy_set_header Connection "";
            proxy_set_header Cookie "";
            proxy_ssl_server_name on;
            proxy_ssl_name api.enablebanking.com;
            proxy_ssl_verify on;
            proxy_ssl_verify_depth 4;
            proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
            proxy_connect_timeout 10s;
            proxy_read_timeout 60s;
            proxy_redirect off;
        }
    }
}
